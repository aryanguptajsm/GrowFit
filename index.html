<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GrowFit — Track small improvements consistently. A modern fitness and healthy weight-gain tracking app.">
  <meta name="theme-color" content="#0a0a0a">
  <title>GrowFit — Healthy Progress Tracker</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════
       APP SHELL
       ═══════════════════════════════════════════════════════════ -->
  <div id="app">

    <!-- ── Main Content Area ─────────────────────────────────── -->
    <main class="app-main">

      <!-- PAGE: Home / Dashboard -->
      <section id="page-home" class="page active">
        <!-- Populated by dashboard.js -->
      </section>

      <!-- PAGE: Exercise -->
      <section id="page-exercise" class="page">
        <!-- Populated by exercise.js -->
      </section>

      <!-- PAGE: Nutrition -->
      <section id="page-nutrition" class="page">
        <!-- Populated by nutrition.js -->
      </section>

      <!-- PAGE: Progress -->
      <section id="page-progress" class="page">
        <!-- Populated by progress.js -->
      </section>

      <!-- PAGE: Journal -->
      <section id="page-journal" class="page">
        <!-- Populated by journal.js -->
      </section>

      <!-- PAGE: More -->
      <section id="page-more" class="page">
        <!-- Populated by more.js -->
      </section>

    </main>

    <!-- ── Bottom Navigation ─────────────────────────────────── -->
    <nav class="bottom-nav" aria-label="Main navigation">

      <button class="nav-item active" data-page="home" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </button>

      <button class="nav-item" data-page="exercise" aria-label="Exercise">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2h0a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2z"/>
          <path d="M6 8a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2h0a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2z"/>
          <line x1="8" y1="11" x2="16" y2="11"/>
          <line x1="2" y1="11" x2="4" y2="11"/>
          <line x1="20" y1="11" x2="22" y2="11"/>
        </svg>
        <span>Exercise</span>
      </button>

      <button class="nav-item" data-page="nutrition" aria-label="Nutrition">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
          <line x1="6" y1="1" x2="6" y2="4"/>
          <line x1="10" y1="1" x2="10" y2="4"/>
          <line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
        <span>Nutrition</span>
      </button>

      <button class="nav-item" data-page="progress" aria-label="Progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span>Progress</span>
      </button>

      <button class="nav-item" data-page="journal" aria-label="Journal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span>Journal</span>
      </button>

      <button class="nav-item" data-page="more" aria-label="More">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1"/>
          <circle cx="19" cy="12" r="1"/>
          <circle cx="5" cy="12" r="1"/>
        </svg>
        <span>More</span>
      </button>

    </nav>

    <!-- ── Modal Overlay ─────────────────────────────────────── -->
    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true">
      <div class="modal" id="modal">
        <div class="modal__handle"><div class="modal__handle-bar"></div></div>
        <div class="modal__header">
          <h2 class="modal__title" id="modal-title">Modal</h2>
          <button class="modal__close" id="modal-close-btn" aria-label="Close modal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="modal__body" id="modal-body">
          <!-- Dynamic content -->
        </div>
      </div>
    </div>

    <!-- ── Toast Container ───────────────────────────────────── -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

  </div>

  <!-- ═══════════════════════════════════════════════════════════
       SCRIPTS (order matters!)
       ═══════════════════════════════════════════════════════════ -->
  <script src="js/storage.js"></script>
  <script src="js/exercise-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/exercise.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/more.js"></script>

</body>
</html>
